<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리로 장면 맞히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/*
VOICE: 말랑하고 장난스러운 퀴즈쇼
IDEA: 커튼이 쳐진 작은 무대 – 소리만 새어 나오고, 정답 때 커튼이 걷힌다
PICTURE: 영상 위를 덮은 스피커 무대(음파 막대가 소리에 맞춰 춤춤)
COLOUR and TYPE: 크림 바탕, 딸기우유 핑크, 하늘색 보조 / Jua + Gowun Dodum
LAYOUT: 제목 → 무대(16:9) → 조작 버튼 → 추측 메모 → 문제 목록·추가
*/
:root{color-scheme:light dark;
--bg:light-dark(#fff8f2,#231c22);--card:light-dark(#ffffff,#2f262e);--ink:light-dark(#3b2a33,#f6e9ef);
--soft:light-dark(#8a7480,#bfa9b5);--pink:#ff8fb1;--pinkd:#e9668f;--sky:#8fd3ff;--line:light-dark(#f1dfe6,#43363f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip}
main{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,14px) 60px}
h1{font:400 clamp(30px,6vw,46px)/1.05 Jua,sans-serif;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--soft);margin:0 0 22px}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.count{font:400 18px Jua,sans-serif;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px}
.stage{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 10px 0 var(--line),0 18px 40px rgba(233,102,143,.18)}
#player,.stage iframe{position:absolute;inset:0;width:100%;height:100%}
.curtain{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;
background:radial-gradient(circle at 50% 38%,#ffd1df 0,#ff9fbd 45%,#e9668f 100%);color:#fff;
transition:transform .7s cubic-bezier(.7,0,.2,1);z-index:2}
.curtain::before,.curtain::after{content:"";position:absolute;top:0;bottom:0;width:9%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 10px,rgba(0,0,0,.06) 10px 20px)}
.curtain::before{left:0}.curtain::after{right:0}
.stage.open .curtain{transform:translateY(-101%)}
.bars{display:flex;gap:7px;align-items:end;height:90px}
.bars i{width:clamp(10px,2.2vw,16px);height:18%;border-radius:8px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.playing .bars i{animation:hop .5s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.25s}.bars i:nth-child(4){animation-delay:.05s}
.bars i:nth-child(5){animation-delay:.3s}.bars i:nth-child(6){animation-delay:.15s}.bars i:nth-child(7){animation-delay:.2s}
@keyframes hop{to{height:100%}}
.status{font:400 clamp(20px,4vw,28px) Jua,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.15);text-align:center;padding:0 12%}
.time{font-size:15px;opacity:.9}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 16px}
button{font:400 18px Jua,sans-serif;min-height:48px;padding:0 20px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.main{background:var(--pink);border-color:var(--pinkd);color:#fff;box-shadow:0 4px 0 var(--pinkd)}
button.ans{background:var(--sky);border-color:#5fb7ea;color:#123247;box-shadow:0 4px 0 #5fb7ea}
button:disabled{opacity:.45;cursor:default}
.grow{flex:1}
label{display:block;font-size:15px;color:var(--soft);margin-bottom:6px}
input,textarea{width:100%;font:16px "Gowun Dodum",sans-serif;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.answer{display:none;margin-top:18px;background:var(--card);border:2px dashed var(--pink);border-radius:18px;padding:16px 18px}
.answer.show{display:block}
.answer h2{font:400 22px Jua,sans-serif;margin:0 0 6px}
.answer a{color:var(--pinkd);font-weight:700;overflow-wrap:anywhere}
.mine{color:var(--soft);font-size:15px;margin:8px 0 0}
.err{display:none;margin-top:12px;color:var(--pinkd)}
section.box{margin-top:40px;border-top:2px solid var(--line);padding-top:22px}
section.box h2{font:400 24px Jua,sans-serif;margin:0 0 12px}
ol{padding:0;margin:0;list-style:none;display:grid;gap:8px}
ol li{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px}
ol li.cur{border-color:var(--pink)}
ol li span{flex:1;font-size:15px;overflow-wrap:anywhere}
ol li button{min-height:40px;font-size:15px;padding:0 12px;box-shadow:none}
.form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:16px}
.form .full{grid-column:1/-1}
.note{font-size:14px;color:var(--soft)}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.form .url{grid-column:1/-1}.ctrl button{flex:1 1 40%}}
@media(prefers-reduced-motion:reduce){.playing .bars i{animation:none;height:70%}.curtain{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>소리만 듣고 장면 맞히기</h1>
      <p class="sub">커튼 뒤에서 몇 초만 소리가 나와요. 어떤 장면일지 맞혀 보세요!</p>
    </div>
    <div class="count" id="count">1 / 1</div>
  </div>

  <div class="stage" id="stage">
    <div id="player"></div>
    <div class="curtain" id="curtain">
      <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="status" id="status">플레이어 준비 중…</div>
      <div class="time" id="time"></div>
    </div>
  </div>

  <div class="ctrl">
    <button class="main" id="btnPlay" disabled>▶ 소리 듣기</button>
    <button id="btnMore" disabled>+1초 힌트</button>
    <button class="ans" id="btnAns" disabled>정답 보기</button>
    <span class="grow"></span>
    <button id="btnPrev">◀ 이전</button>
    <button id="btnNext">다음 ▶</button>
  </div>

  <label for="guess">내 추측 (적어 두면 정답과 같이 보여 줘요)</label>
  <input id="guess" placeholder="예: 누군가 깜짝 놀라는 장면?">

  <div class="answer" id="answer">
    <h2>정답 장면</h2>
    <div id="ansText"></div>
    <p>영상으로 확인하기: <a id="ansLink" href="#" target="_blank" rel="noopener"></a></p>
    <p class="mine" id="mine"></p>
  </div>
  <p class="err" id="err"></p>

  <section class="box">
    <h2>문제 목록</h2>
    <ol id="list"></ol>
    <div class="form">
      <div class="url"><label for="fUrl">YouTube 링크 (?t=40 이 있으면 시작 시간 자동 입력)</label><input id="fUrl" placeholder="https://youtu.be/...?t=40"></div>
      <div><label for="fStart">시작(초)</label><input id="fStart" type="number" min="0" step="0.5" value="0"></div>
      <div><label for="fDur">재생 길이(초)</label><input id="fDur" type="number" min="0.5" step="0.5" value="2"></div>
      <div class="full"><label for="fAns">정답 설명 (선택)</label><input id="fAns" placeholder="정답 때 보여 줄 한 줄 설명"></div>
      <div class="full"><button class="main" id="btnAdd">문제 추가</button> <span class="note">추가한 문제는 이 브라우저에 저장돼요.</span></div>
    </div>
  </section>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
{
const DEFAULT = [
  { id: "Dt6BVyftR6w", start: 40, dur: 2, answer: "" }
];
const KEY = "sound-quiz-rounds";
let rounds = DEFAULT.slice();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length) rounds = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rounds)); } catch (e) {} };

const $ = id => document.getElementById(id);
const stage = $("stage"), statusEl = $("status"), timeEl = $("time");
let idx = 0, player = null, ready = false, extra = 0, clipEnd = 0, watcher = null, mode = "idle";

function parseUrl(u) {
  u = (u || "").trim();
  let id = "", t = null;
  try {
    const url = new URL(u);
    if (url.hostname.includes("youtu.be")) id = url.pathname.slice(1).split("/")[0];
    else if (url.pathname.startsWith("/shorts/") || url.pathname.startsWith("/embed/")) id = url.pathname.split("/")[2];
    else id = url.searchParams.get("v") || "";
    const tv = url.searchParams.get("t") || url.searchParams.get("start");
    if (tv) {
      const m = tv.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s?)?$/);
      t = m ? (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)) : parseFloat(tv);
    }
  } catch (e) { if (/^[\w-]{11}$/.test(u)) id = u; }
  return { id, t };
}
const fmt = s => { s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const linkOf = r => "https://youtu.be/" + r.id + "?t=" + Math.floor(r.start);

function stopWatch() { clearInterval(watcher); watcher = null; stage.classList.remove("playing"); }

function load(i) {
  idx = (i + rounds.length) % rounds.length;
  const r = rounds[idx];
  stopWatch(); extra = 0; mode = "idle";
  stage.classList.remove("open");
  $("answer").classList.remove("show");
  $("err").style.display = "none";
  $("guess").value = "";
  $("count").textContent = (idx + 1) + " / " + rounds.length;
  statusEl.textContent = ready ? "버튼을 누르면 소리가 나와요" : "플레이어 준비 중…";
  timeEl.textContent = r.dur + "초 동안 재생";
  if (ready) player.cueVideoById({ videoId: r.id, startSeconds: r.start });
  setBtns();
  renderList();
}

function setBtns() {
  $("btnPlay").disabled = !ready;
  $("btnMore").disabled = !ready || mode === "answer";
  $("btnAns").disabled = !ready || mode === "answer";
  $("btnPlay").textContent = mode === "answer" ? "▶ 장면 다시 보기" : (mode === "heard" ? "↺ 다시 듣기" : "▶ 소리 듣기");
}

function playClip() {
  const r = rounds[idx];
  if (mode === "answer") { player.seekTo(r.start, true); player.playVideo(); return; }
  stopWatch();
  const len = r.dur + extra;
  clipEnd = r.start + len;
  player.seekTo(r.start, true);
  player.unMute(); player.playVideo();
  statusEl.textContent = "귀 기울여 보세요…";
  stage.classList.add("playing");
  watcher = setInterval(() => {
    const t = player.getCurrentTime ? player.getCurrentTime() : 0;
    const st = player.getPlayerState();
    if (st === YT.PlayerState.PLAYING) timeEl.textContent = Math.max(0, clipEnd - t).toFixed(1) + "초 남음";
    if (t >= clipEnd || st === YT.PlayerState.ENDED) {
      player.pauseVideo(); stopWatch(); mode = "heard";
      statusEl.textContent = "어떤 장면일까요?";
      timeEl.textContent = len + "초 들었어요";
      setBtns();
    }
  }, 50);
}

function reveal() {
  const r = rounds[idx];
  stopWatch(); mode = "answer";
  stage.classList.add("open");
  $("ansText").textContent = r.answer || "";
  $("ansText").style.display = r.answer ? "block" : "none";
  const a = $("ansLink"); a.href = linkOf(r); a.textContent = linkOf(r) + " (" + fmt(r.start) + "부터)";
  const g = $("guess").value.trim();
  $("mine").textContent = g ? "내 추측: " + g : "";
  $("answer").classList.add("show");
  player.seekTo(r.start, true); player.playVideo();
  setBtns();
}

function renderList() {
  const ol = $("list"); ol.innerHTML = "";
  rounds.forEach((r, i) => {
    const li = document.createElement("li");
    if (i === idx) li.className = "cur";
    const sp = document.createElement("span");
    sp.textContent = (i + 1) + ". " + r.id + " · " + fmt(r.start) + "부터 " + r.dur + "초" + (r.answer ? " · " + r.answer : "");
    const go = document.createElement("button"); go.textContent = "풀기"; go.onclick = () => load(i);
    const del = document.createElement("button"); del.textContent = "삭제";
    del.disabled = rounds.length < 2;
    del.onclick = () => { rounds.splice(i, 1); save(); load(Math.min(idx, rounds.length - 1)); };
    li.append(sp, go, del); ol.append(li);
  });
}

$("fUrl").addEventListener("input", e => { const p = parseUrl(e.target.value); if (p.t != null && !isNaN(p.t)) $("fStart").value = p.t; });
$("btnAdd").onclick = () => {
  const p = parseUrl($("fUrl").value);
  if (!p.id) { $("err").textContent = "YouTube 링크를 확인해 주세요."; $("err").style.display = "block"; return; }
  rounds.push({ id: p.id, start: Math.max(0, +$("fStart").value || 0), dur: Math.max(0.5, +$("fDur").value || 2), answer: $("fAns").value.trim() });
  save(); $("fUrl").value = ""; $("fAns").value = ""; load(rounds.length - 1);
};
$("btnPlay").onclick = playClip;
$("btnMore").onclick = () => { extra += 1; mode = "idle"; playClip(); };
$("btnAns").onclick = reveal;
$("btnPrev").onclick = () => load(idx - 1);
$("btnNext").onclick = () => load(idx + 1);

window.onYouTubeIframeAPIReady = () => {
  const r = rounds[idx];
  player = new YT.Player("player", {
    videoId: r.id,
    playerVars: { start: Math.floor(r.start), controls: 0, disablekb: 1, rel: 0, playsinline: 1, cc_load_policy: 0, iv_load_policy: 3, fs: 0 },
    events: {
      onReady: () => { ready = true; load(idx); },
      onError: e => {
        const msg = (e.data === 101 || e.data === 150 || e.data === 153)
          ? "이 영상은 다른 페이지에서 재생이 막혀 있거나, 파일을 직접 열어서 생긴 오류예요. 로컬 서버(localhost)로 열어 보세요."
          : "영상을 불러오지 못했어요 (오류 " + e.data + ").";
        $("err").textContent = msg; $("err").style.display = "block";
        statusEl.textContent = "재생할 수 없어요";
      }
    }
  });
};
load(0);
}
</script>
</body>
</html>
