<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>먼작귀 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 말랑말랑한 그림책, 손으로 그린 듯 삐뚤빼뚤한 선
IDEA: 그림책 한 페이지 – 언덕 위 무대에서 소리만 들리고, 정답 때 페이지가 넘어간다
PICTURE: 파스텔 하늘, 둥근 풀언덕, 구름, 통통 튀는 소리 방울
COLOUR and TYPE: 크림 종이, 갈색 연필 선, 딸기우유·민트·버터 / Jua + Gaegu
LAYOUT: 제목 → 무대(16:9) → 버튼 → 추측 메모 → 접힌 문제 목록
*/
:root{color-scheme:light;
--paper:#fff9ef;--ink:#5a4036;--soft:#8c7468;--pink:#ffc1d3;--pinkd:#f28fae;--mint:#c8ecd9;--mintd:#86c9a6;
--butter:#fff0b3;--butterd:#e9c85a;--sky:#cfe9ff;--card:#fffdf8;
--wob:255px 18px 225px 18px/18px 225px 18px 255px;--wob2:18px 225px 18px 255px/255px 18px 225px 18px}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:20px/1.5 Gaegu,"Jua",system-ui,sans-serif;overflow-x:clip;
background:var(--paper) radial-gradient(circle,#f3e3d3 1.2px,transparent 1.6px) 0 0/22px 22px}
main{max-width:820px;margin:0 auto;padding:clamp(18px,4vw,40px) max(4vw,14px) 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font:400 clamp(30px,6.4vw,46px)/1.08 Jua,sans-serif;margin:0;text-wrap:balance;
text-shadow:3px 3px 0 var(--pink)}
.sub{margin:6px 0 0;color:var(--soft);font-size:19px}
.tag{font:400 18px Jua,sans-serif;background:var(--butter);border:2.5px solid var(--ink);border-radius:var(--wob);
padding:6px 16px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.stage{position:relative;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:var(--wob);overflow:hidden;background:#000;
box-shadow:6px 6px 0 var(--ink)}
#player,.stage iframe{position:absolute;inset:0;width:100%;height:100%}
.page{position:absolute;inset:0;z-index:2;overflow:hidden;
background:linear-gradient(#cfe9ff 0%,#fde3ee 70%,#fff4e4 100%);
transition:transform .8s cubic-bezier(.7,0,.2,1),opacity .8s;transform-origin:left center}
.stage.open .page{transform:perspective(1400px) rotateY(-100deg);opacity:0;pointer-events:none}
.page svg.scene{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift 14s ease-in-out infinite alternate}
.cloud.b{animation-duration:18s;animation-delay:-6s}
@keyframes drift{to{transform:translateX(40px)}}
.center{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;padding-bottom:14%}
.drops{display:flex;gap:clamp(6px,1.4vw,10px);align-items:end;height:clamp(54px,12vw,88px)}
.drops i{width:clamp(14px,3vw,22px);height:30%;border:2.5px solid var(--ink);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:var(--pink)}
.drops i:nth-child(3n+2){background:var(--mint)}.drops i:nth-child(3n){background:var(--butter)}
.playing .drops i{animation:hop .42s ease-in-out infinite alternate}
.drops i:nth-child(2){animation-delay:.12s}.drops i:nth-child(3){animation-delay:.26s}.drops i:nth-child(4){animation-delay:.06s}
.drops i:nth-child(5){animation-delay:.3s}.drops i:nth-child(6){animation-delay:.18s}.drops i:nth-child(7){animation-delay:.22s}
@keyframes hop{to{height:100%}}
.bubble{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:var(--wob2);padding:8px 20px;
font:400 clamp(18px,3.8vw,26px) Jua,sans-serif;text-align:center;max-width:82%;box-shadow:3px 3px 0 var(--ink)}
.bubble small{display:block;font:700 clamp(14px,2.6vw,17px) Gaegu,sans-serif;color:var(--soft)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 18px}
button{font:400 19px Jua,sans-serif;min-height:50px;padding:0 20px;border:2.5px solid var(--ink);border-radius:var(--wob);
background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 4px 0 var(--ink);transition:transform .08s}
button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px dashed var(--pinkd);outline-offset:3px}
button.p{background:var(--pink)}button.m{background:var(--mint)}button.y{background:var(--butter)}
button:disabled{opacity:.45;cursor:default}
button.end{background:#e9ddd3}
.grow{flex:1}
label{display:block;font-size:18px;color:var(--soft);margin-bottom:4px}
input{width:100%;font:700 18px Gaegu,sans-serif;padding:10px 14px;border:2.5px solid var(--ink);border-radius:var(--wob2);background:var(--card);color:var(--ink)}
.answer{display:none;margin-top:20px;background:var(--card);border:2.5px dashed var(--pinkd);border-radius:var(--wob);padding:16px 20px;position:relative}
.answer.show{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.answer h2{font:400 24px Jua,sans-serif;margin:0 0 4px}
.answer a{color:#c9577b;font-weight:700;overflow-wrap:anywhere}
.answer p{margin:4px 0}
.mine{color:var(--soft)}
.err{display:none;margin-top:12px;color:#c9577b;font-weight:700}
.answer .q{margin-top:12px;font:400 20px Jua,sans-serif}
.ox{display:flex;gap:14px;margin-top:6px}
.ox button{flex:1;min-height:64px;font:400 34px Jua,sans-serif}
.ox .o{background:var(--mint)}.ox .x{background:var(--pink)}
.ox button.sel{outline:4px solid var(--ink);outline-offset:2px}
.ox button:disabled{opacity:.35}.ox button.sel:disabled{opacity:1}
footer{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--soft);font-size:17px}
.linkbtn{width:64px;height:64px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--butter)}
.modal{display:none;position:fixed;inset:0;z-index:100;border:0;padding:20px;margin:0;color:inherit;
background:rgba(90,64,54,.45);width:100%;max-width:none;height:100%;max-height:none;overflow-y:auto;overscroll-behavior:contain}
.modal.show{display:flex}
.modal::backdrop{background:transparent}
html.lock{overflow:hidden}
.modal .card{margin:auto;width:min(420px,100%);background:var(--card);border:3px solid var(--ink);border-radius:var(--wob);
box-shadow:6px 6px 0 var(--ink);padding:24px 22px;text-align:center;animation:popIn .35s ease-out}
@keyframes popIn{from{transform:scale(.94)}}
.modal h2{font:400 30px Jua,sans-serif;margin:0}
.score{font:400 30px Jua,sans-serif;margin:8px 0 0}.score b{font-size:64px;font-weight:400;color:var(--pinkd);text-shadow:3px 3px 0 var(--ink)}
.grade{display:inline-block;margin:10px 0 0;font:400 26px Jua,sans-serif;background:var(--butter);border:2.5px solid var(--ink);border-radius:var(--wob2);padding:4px 18px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.grade.black{background:var(--ink);color:#fff0b3}
.pct{margin:0;color:var(--soft);font-size:18px}
.modal .row{display:grid;gap:10px;margin-top:16px}
@media(max-height:560px){.modal .card{padding:14px 18px}.modal h2{font-size:24px}.score b{font-size:44px}.grade{font-size:21px;margin-top:4px}.modal .row{grid-template-columns:1fr 1fr;margin-top:10px}.modal .row button{min-height:44px;font-size:16px;padding:0 8px;white-space:nowrap}}
.vol{display:flex;align-items:center;gap:12px;margin:-4px 0 8px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob2);padding:6px 16px;max-width:420px}
.vol label{margin:0;font:400 18px Jua,sans-serif;color:var(--ink);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:4px}
.vol input{flex:1;padding:0;border:0;background:none;accent-color:var(--pinkd);height:28px;cursor:pointer}
.vol output{font:400 17px Jua,sans-serif;min-width:3ch;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,40px);opacity:0;pointer-events:none;
background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;font-size:17px;transition:.25s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
@media(max-width:600px){
.ctrl button{flex:1 1 40%}.grow{display:none}.stage{box-shadow:4px 4px 0 var(--ink);border-radius:26px 10px 22px 12px/12px 22px 10px 26px}}
@media(prefers-reduced-motion:reduce){.playing .drops i,.cloud{animation:none}.playing .drops i{height:75%}.page{transition:opacity .2s}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>먼작귀 퀴즈</h1>
      <p class="sub">이거 고거잖아... 고거....</p>
    </div>
    <div class="tag" id="count">1 / 1</div>
  </div>

  <div class="stage" id="stage">
    <div id="player"></div>
    <div class="page" id="page">
      <svg class="scene" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <g id="cl"><circle cx="0" cy="0" r="26"/><circle cx="30" cy="-12" r="32"/><circle cx="64" cy="0" r="24"/><rect x="0" y="-4" width="64" height="28" rx="14"/></g>
          <path id="star" d="M0-11 3-3 11-3 5 2 7 10 0 5-7 10-5 2-11-3-3-3Z"/>
        </defs>
        <g fill="#fff" stroke="#5a4036" stroke-width="3" stroke-linejoin="round">
          <use href="#cl" class="cloud" x="90" y="80"/>
          <use href="#cl" class="cloud b" x="600" y="60"/>
        </g>
        <g fill="#fff0b3" stroke="#5a4036" stroke-width="2.5" stroke-linejoin="round">
          <use href="#star" x="250" y="60"/><use href="#star" x="520" y="110"/><use href="#star" x="720" y="160"/>
        </g>
        <path d="M-20 470 C 80 330 260 330 380 380 C 500 430 640 300 830 350 L 830 470 Z" fill="#b5e3c6" stroke="#5a4036" stroke-width="3.5"/>
        <path d="M-20 470 C 120 400 280 410 420 430 C 560 450 700 400 830 420 L 830 470 Z" fill="#9ad6b0" stroke="#5a4036" stroke-width="3"/>
        <g fill="none" stroke="#5a4036" stroke-width="2.5" stroke-linecap="round">
          <path d="M120 380 l-6 -14 M126 378 l2 -16 M132 380 l8 -12"/>
          <path d="M640 368 l-6 -14 M646 366 l2 -16 M652 368 l8 -12"/>
          <path d="M400 412 l-5 -12 M406 410 l2 -14 M412 412 l7 -10"/>
        </g>
        <g stroke="#5a4036" stroke-width="2.5">
          <circle cx="200" cy="402" r="9" fill="#ffc1d3"/><circle cx="200" cy="402" r="3.5" fill="#fff0b3"/>
          <circle cx="580" cy="396" r="9" fill="#fff"/><circle cx="580" cy="396" r="3.5" fill="#fff0b3"/>
        </g>
      </svg>
      <div class="center">
        <div class="drops"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="bubble" id="status">플레이어 준비 중…<small id="time"></small></div>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <button class="p" id="btnPlay" disabled>▶ 듣기</button>
    <button class="m" id="btnAns" disabled>정답 보기</button>
    <span class="grow"></span>
    <button id="btnPrev">◀ 이전</button>
    <button id="btnNext">다음 문제 ▶</button>
    <button class="end" id="btnEnd">■ 종료하고 채점</button>
  </div>
  <div class="vol">
    <label for="vol" id="volIcon">🔊 볼륨</label>
    <input type="range" id="vol" min="0" max="100" step="5" aria-label="볼륨">
    <output id="volOut" for="vol">70</output>
  </div>

  <div class="answer" id="answer">
    <h2>정답 장면이에요!</h2>
    <p id="ansText"></p>
    <p>영상으로 확인하기: <a id="ansLink" href="#" target="_blank" rel="noopener"></a></p>
    <p class="q">맞혔나요?</p>
    <div class="ox">
      <button class="o" id="btnO" aria-label="맞혔어요">O</button>
      <button class="x" id="btnX" aria-label="틀렸어요">X</button>
    </div>
  </div>
  <p class="err" id="err"></p>

  <footer>
    <button class="linkbtn" id="btnLink" aria-label="이 페이지 공유하기">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    </button>
    <span>친구에게 퀴즈 공유하기</span>
  </footer>
</main>

<dialog class="modal" id="result" aria-labelledby="resTitle">
  <div class="card">
    <h2 id="resTitle">결과 발표!</h2>
    <p class="grade" id="resGrade"></p>
    <p class="score"><b id="resScore">0</b> / <span id="resTotal">0</span></p>
    <p class="pct" id="resPct"></p>
    <p id="resMsg"></p>
    <div class="row">
      <button class="p" id="btnShare">카카오톡으로 공유하기</button>
      <button class="m" id="btnRetry">다시 하기</button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
const DUR = 3;
const BASE = [
  { id: "Dt6BVyftR6w", start: 40 },
  { id: "f8_JB4t34S0", start: 19 },
  { id: "VVO3ffaExr4", start: 50 },
  { id: "IOEPQkcuWsc", start: 41 },
  { id: "GQmeOs_lwMs", start: 55 },
  { id: "vmwXuGDNKlI", start: 16 },
  { id: "tSjEgj5zjv0", start: 31 },
  { id: "cXDK9tbNCEU", start: 57 },
  { id: "Ph_dKzMNx58", start: 18 },
  { id: "jUbSYJJSs_M", start: 3 },
  { id: "Vg66rPDlwlU", start: 13 },
  { id: "Vg66rPDlwlU", start: 49 },
  { id: "XE_0yrgRC9s", start: 24 },
  { id: "nCLx8vmHDqY", start: 9 },
  { id: "XvJ6-UQbbYE", start: 41 },
  { id: "cC3BL9YeFSU", start: 52 },
  { id: "dyNbwLmE7C8", start: 16 },
  { id: "_4HEngaUROg", start: 30 },
  { id: "_4HEngaUROg", start: 43 },
  { id: "AsKXFHOAvbY", start: 42 },
  { id: "3kSvvXrtd9w", start: 26 },
  { id: "3kSvvXrtd9w", start: 57 },
  { id: "x-OxpDicqKo", start: 27 },
  { id: "x-OxpDicqKo", start: 51 },
  { id: "YiXvoKtKn2Q", start: 16 },
  { id: "DIFB-xZdK0c", start: 47 },
  { id: "lv1P47MubJo", start: 22 },
  { id: "Lsja9wxLOGA", start: 16 },
  { id: "xoBISdrp2zQ", start: 31 },
  { id: "Od_aDJTnh7A", start: 7 },
  { id: "PN0VmWYBRII", start: 56 },
  { id: "qrSYMFdA4-w", start: 31 },
  { id: "OXf8IUiVd5k", start: 39 },
  { id: "jD1NPsonick", start: 25 },
  { id: "v_f2Uzk5z9s", start: 56 },
  { id: "TU01o8ySPGk", start: 52 },
  { id: "eRkOZRaO7Gw", start: 16 },
  { id: "G8RbrrDwWY4", start: 14 },
  { id: "JJcAwbmTXEc", start: 18 },
  { id: "96Ho_bFxPqA", start: 23 },
  { id: "ZTdG5TB-mzk", start: 47 },
  { id: "F4OgX_mt9TU", start: 20 },
  { id: "QKaThZL6DTU", start: 40 }
].map(r => ({ dur: DUR, answer: "", ...r }));
const rounds = BASE;
// 카카오 개발자 콘솔에서 받은 JavaScript 키를 넣으면 카카오톡 공유창이 바로 열려요.
// 비워 두면 스마트폰 기본 공유 시트(카카오톡 선택 가능) → 안 되면 링크 복사로 동작해요.
const KAKAO_KEY = "4fd735651b98e06d3c95c5fffca616cb";

const $ = id => document.getElementById(id);
const stage = $("stage"), statusEl = $("status"), timeEl = $("time");
let idx = 0, player = null, ready = false, extra = 0, clipEnd = 0, watcher = null, mode = "idle";
let order = [], pos = 0, results = {};
let vol = 70;
try { const v = parseInt(localStorage.getItem("quiz-volume"), 10); if (v >= 0 && v <= 100) vol = v; } catch (e) {}
function applyVol() {
  $("vol").value = vol; $("volOut").textContent = vol;
  $("volIcon").textContent = (vol === 0 ? "🔇" : vol < 50 ? "🔉" : "🔊") + " 볼륨";
  if (!player || !ready) return;
  try { player.setVolume(vol); if (vol === 0) player.mute(); else player.unMute(); } catch (e) {}
}

// Fisher–Yates로 고르게 섞고, 같은 영상의 두 문제가 연달아 나오면 다시 섞기
function shuffle() {
  const adjacent = o => o.some((v, i) => i > 0 && rounds[v].id === rounds[o[i - 1]].id);
  for (let tries = 0; tries < 200; tries++) {
    order = rounds.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    if (!adjacent(order)) break;
  }
}
const fmt = s => { s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const linkOf = r => "https://youtu.be/" + r.id + "?t=" + Math.floor(r.start);
function say(main, sub) { statusEl.firstChild.textContent = main; timeEl.textContent = sub || ""; }
function stopWatch() { clearInterval(watcher); watcher = null; stage.classList.remove("playing"); }

function show() {
  idx = order[pos];
  const r = rounds[idx];
  stopWatch(); extra = 0; mode = "idle";
  stage.classList.remove("open");
  $("answer").classList.remove("show");
  $("err").style.display = "none";
  $("count").textContent = (pos + 1) + " / " + rounds.length;
  say(ready ? "3초만 듣고 맞춰보자!" : "플레이어 준비 중…", ready ? "에이 에이 오!" : "");
  if (ready) player.cueVideoById({ videoId: r.id, startSeconds: r.start });
  setBtns();
}
function next() { if (pos < order.length - 1) { pos++; show(); } else finish(); }
function prev() { if (pos > 0) { pos--; show(); } }

function setBtns() {
  $("btnPlay").disabled = !ready;
  $("btnAns").disabled = !ready || mode === "answer";
  $("btnPrev").disabled = pos === 0;
  $("btnNext").textContent = pos === order.length - 1 ? "결과 보기 ▶" : "다음 문제 ▶";
  $("btnPlay").textContent = mode === "answer" ? "▶ 다시 보기" : (mode === "heard" ? "↺ 다시 듣기" : "▶ 듣기");
  const v = results[idx];
  ["btnO", "btnX"].forEach(b => { const el = $(b); el.disabled = v !== undefined; el.classList.toggle("sel", v === (b === "btnO")); });
}

function playClip() {
  const r = rounds[idx];
  if (mode === "answer") { player.seekTo(r.start, true); player.playVideo(); return; }
  stopWatch();
  const len = r.dur + extra;
  clipEnd = r.start + len;
  player.seekTo(r.start, true);
  applyVol(); player.playVideo();
  say("하아아아!!???…", "");
  stage.classList.add("playing");
  watcher = setInterval(() => {
    const t = player.getCurrentTime ? player.getCurrentTime() : 0;
    const st = player.getPlayerState();
    if (st === YT.PlayerState.PLAYING) timeEl.textContent = Math.max(0, clipEnd - t).toFixed(1) + "초 남음";
    if (t >= clipEnd || st === YT.PlayerState.ENDED) {
      player.pauseVideo(); stopWatch(); mode = "heard";
      say("어떤 장면일까요?", len + "초 들었어요");
      setBtns();
    }
  }, 50);
}

function reveal() {
  const r = rounds[idx];
  stopWatch(); mode = "answer";
  stage.classList.add("open");
  $("ansText").textContent = r.answer || "";
  $("ansText").style.display = r.answer ? "block" : "none";
  const a = $("ansLink"); a.href = linkOf(r); a.textContent = linkOf(r) + " (" + fmt(r.start) + "부터)";
  $("answer").classList.add("show");
  player.seekTo(r.start, true); player.playVideo();
  setBtns();
}

function judge(ok) {
  if (results[idx] !== undefined) return;
  results[idx] = ok;
  setBtns();
  setTimeout(next, 500);
}

const GRADES = [
  { min: 91, name: "검은 별똥별", cls: "black", msg: "소리만 들어도 장면이 다 보이는 경지! 더 이상 가르칠 게 없어요." },
  { min: 71, name: "별똥별", msg: "반짝반짝! 웬만한 장면은 다 알아듣는 실력이에요." },
  { min: 50, name: "우호형", msg: "꽤 친해졌네요! 조금만 더 들으면 별똥별도 가능해요." },
  { min: 0, name: "의태형", msg: "아직은 흉내만 내는 단계… 다시 들으면 고거 알 수 있어요!" }
];
let lastResult = null;
function finish() {
  stopWatch(); if (player && player.pauseVideo) player.pauseVideo();
  const vals = Object.values(results), solved = vals.length, score = vals.filter(Boolean).length;
  const pct = solved ? Math.round(score / solved * 100) : 0;
  const g = GRADES.find(x => pct >= x.min);
  lastResult = { score, solved, pct, g };
  $("resGrade").textContent = g.name; $("resGrade").className = "grade " + (g.cls || "");
  $("resScore").textContent = score; $("resTotal").textContent = solved;
  $("resPct").textContent = "정답률 " + pct + "%" + (solved < rounds.length ? " · 전체 " + rounds.length + "문제 중 " + solved + "문제 풀었어요" : "");
  $("resMsg").textContent = g.msg;
  const d = $("result");
  d.classList.add("show");
  if (typeof d.showModal === "function" && !d.open) { try { d.showModal(); } catch (e) {} }
  document.documentElement.classList.add("lock");
  $("btnShare").focus();
}
function closeResult() {
  const d = $("result");
  d.classList.remove("show");
  if (typeof d.close === "function" && d.open) { try { d.close(); } catch (e) {} }
  d.removeAttribute("open");
  document.documentElement.classList.remove("lock");
}
function restart() { closeResult(); results = {}; shuffle(); pos = 0; show(); }

// ---------- 공유 ----------
const pageUrl = () => location.origin + location.pathname;
let kakaoReady = false;
if (KAKAO_KEY) {
  const sc = document.createElement("script");
  sc.src = "https://t1.kakaocdn.net/kakao_js_sdk/2.8.2/kakao.min.js";
  sc.onload = () => { try { if (!Kakao.isInitialized()) Kakao.init(KAKAO_KEY); kakaoReady = true; } catch (e) {} };
  document.head.append(sc);
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }
async function copy(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok;
}
async function share(text) {
  const url = pageUrl();
  if (kakaoReady) {
    try { Kakao.Share.sendDefault({ objectType: "text", text, link: { mobileWebUrl: url, webUrl: url }, buttonTitle: "퀴즈 풀러 가기" }); return; } catch (e) {}
  }
  if (navigator.share) {
    try { await navigator.share({ title: document.title, text, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  toast(await copy(text + "\n" + url) ? "링크를 복사했어요! 카톡 대화창에 붙여 넣어 주세요" : url);
}

$("btnPlay").onclick = playClip;
$("btnAns").onclick = reveal;
$("btnPrev").onclick = prev;
$("btnNext").onclick = next;
$("btnO").onclick = () => judge(true);
$("btnX").onclick = () => judge(false);
$("btnRetry").onclick = restart;
$("result").addEventListener("close", () => document.documentElement.classList.remove("lock"));
$("result").addEventListener("cancel", e => e.preventDefault());
$("btnShare").onclick = () => { const r = lastResult; share("먼작귀 소리 퀴즈 결과: [" + r.g.name + "] " + r.solved + "문제 중 " + r.score + "개 정답 (" + r.pct + "%)! 너도 도전해 봐 👂"); };
$("btnEnd").onclick = finish;
$("vol").addEventListener("input", e => { vol = +e.target.value; applyVol(); try { localStorage.setItem("quiz-volume", vol); } catch (er) {} });
applyVol();
$("btnLink").onclick = () => share("이거 고거잖아... 고거.... 3초만 듣고 맞히는 먼작귀 소리 퀴즈!");

shuffle();
show();

// ---------- YouTube 플레이어 ----------
// 콜백을 먼저 등록한 뒤 API를 불러와서, 휴대폰에서 API가 먼저 준비돼 신호를 놓치는 문제를 막아요.
let initDone = false, readyWatch = null;
function markReady() {
  if (ready) return;
  ready = true; clearInterval(readyWatch); clearTimeout(slowT); applyVol(); show();
}
function initPlayer() {
  if (initDone || !(window.YT && YT.Player)) return;
  initDone = true;
  const r = rounds[idx];
  player = new YT.Player("player", {
    videoId: r.id,
    playerVars: { start: Math.floor(r.start), controls: 0, disablekb: 1, rel: 0, playsinline: 1, cc_load_policy: 0, iv_load_policy: 3, fs: 0, origin: location.origin },
    events: {
      onReady: markReady,
      onError: e => {
        const msg = (e.data === 101 || e.data === 150 || e.data === 153)
          ? "이 영상은 다른 페이지에서 재생이 막혀 있어요. 정답 링크로 YouTube에서 확인하거나 다음 문제로 넘어가 주세요."
          : "영상을 불러오지 못했어요 (오류 " + e.data + ").";
        $("err").textContent = msg; $("err").style.display = "block";
        say("재생할 수 없어요", "");
      }
    }
  });
  // onReady 신호가 안 와도 플레이어가 실제로 준비되면 시작
  readyWatch = setInterval(() => { try { if (player && typeof player.getPlayerState === "function" && player.getPlayerState() !== undefined) markReady(); } catch (e) {} }, 500);
}
const prevReady = window.onYouTubeIframeAPIReady;
window.onYouTubeIframeAPIReady = () => { if (prevReady) try { prevReady(); } catch (e) {} initPlayer(); };
if (window.YT && YT.Player) initPlayer();
else {
  const sc = document.createElement("script");
  sc.src = "https://www.youtube.com/iframe_api";
  sc.onerror = () => say("YouTube를 불러오지 못했어요", "인터넷 연결을 확인하고 새로고침해 주세요");
  document.head.append(sc);
}
// 10초가 지나도 준비가 안 되면 안내
const slowT = setTimeout(() => {
  if (ready) return;
  say("플레이어가 늦어지고 있어요", "새로고침해 보거나 Chrome·Safari에서 열어 주세요");
  $("err").innerHTML = "";
  const b = document.createElement("button"); b.className = "p"; b.textContent = "↻ 새로고침";
  b.onclick = () => location.reload();
  $("err").append(b); $("err").style.display = "block";
}, 10000);
}
</script>
</body>
